[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "khmer-localization"
version = "2.2.0"
description = "Production-grade Khmer localization skill, utilities, dataset registry, and i18n quality audit engine."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Seng Chhunsour", url = "https://github.com/Chhunsour" }
]
keywords = [
    "khmer",
    "cambodia",
    "localization",
    "i18n",
    "l10n",
    "unicode",
    "khqr",
    "chuon-nath",
    "riel",
    "khr",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Khmer",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
khmer-audit = "scripts.audit_khmer_i18n:main"
khmer-check = "scripts.check_khmer_unicode:main"
khmer-utils = "scripts.khmer_utils:main"

[project.urls]
Homepage = "https://github.com/Chhunsour/khmer-localization"
Documentation = "https://github.com/Chhunsour/khmer-localization#readme"
Issues = "https://github.com/Chhunsour/khmer-localization/issues"
