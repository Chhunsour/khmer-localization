name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Run automated unit tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v

    - name: Verify CLI --help output
      run: |
        python scripts/check_khmer_unicode.py --help
        python scripts/khmer_utils.py --help
        python scripts/audit_khmer_i18n.py --help

    - name: Run runnable examples
      run: |
        python examples/ecommerce_checkout.py
        python examples/hr_payroll.py
        node examples/ecommerce_checkout.js
        node examples/hr_payroll.js

    - name: Run Unicode integrity check on repository
      run: |
        python scripts/check_khmer_unicode.py --strict .
