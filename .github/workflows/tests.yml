name: Tests

on:
  push:
    branches: [ "main", "improve-skill-token-usage" ]
  pull_request:
    branches: [ "main", "improve-skill-token-usage" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Run automated unit tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v

    - name: Verify CLI tools and zero-token lookups
      run: |
        python scripts/check_khmer_unicode.py --help
        python scripts/khmer_utils.py --help
        python scripts/audit_khmer_i18n.py --help
        node scripts/khmer_utils.js --help
        python scripts/khmer_utils.py lookup "Settings"
        node scripts/khmer_utils.js lookup "Settings"
        python scripts/khmer_utils.py fix "សរុបតម្លៃ 25.00៛"
        node scripts/khmer_utils.js fix "សរុបតម្លៃ 25.00៛"
        python scripts/khmer_utils.py relative-time 300
        node scripts/khmer_utils.js relative-time 300
        python scripts/khmer_utils.py address "ផ្ទះលេខ 42, ផ្លូវ 310, បឹងកេងកង, ភ្នំពេញ"
        node scripts/khmer_utils.js address "ផ្ទះលេខ 42, ផ្លូវ 310, បឹងកេងកង, ភ្នំពេញ"
        python scripts/khmer_utils.py break "ចូលគណនី"
        node scripts/khmer_utils.js break "ចូលគណនី"
        python scripts/install_agent_rules.py --dry-run --target all
        node scripts/khmer_utils.js install-rules --dry-run --target all

    - name: Run runnable examples
      run: |
        python examples/ecommerce_checkout.py
        python examples/hr_payroll.py
        node examples/ecommerce_checkout.js
        node examples/hr_payroll.js

    - name: Run Unicode integrity check on repository
      run: |
        python scripts/check_khmer_unicode.py --strict .

    - name: Run Khmer i18n audit scanner
      run: |
        python scripts/audit_khmer_i18n.py
